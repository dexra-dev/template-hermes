[project]
name = "dexra-hermes-template"
version = "0.1.0"
description = "Hermes Agent template: a Solana trading agent where Dexra checks every buy. Dry run by default."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "solders>=0.26",
    "mcp==2.3.0",
]

[project.scripts]
dexra-trader = "dexra_trader.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.14",
    "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dexra_core", "dexra_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Copied verbatim from the shared Dexra core; linted there.
extend-exclude = ["dexra_core", "tests/conftest.py", "tests/test_config.py", "tests/test_guard.py", "tests/test_trade.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.isort]
known-first-party = ["conftest", "dexra_core", "dexra_trader"]

[tool.pyright]
include = ["dexra_trader"]
pythonVersion = "3.11"
